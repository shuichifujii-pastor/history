<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歴史人名辞典</title>
  <meta name="description" content="紀元後の西洋史・日本史の人物を調べて、カードとクイズで覚える学習用の人名辞典">
  <meta name="theme-color" content="#6a5cff">
  <!-- アイコン（ブラウザのタブ／スマホのホーム画面） -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=16">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=16">
  <link rel="manifest" href="manifest.webmanifest?v=16">
  <meta name="apple-mobile-web-app-title" content="人名辞典">
  <script>
    try { if (localStorage.getItem('jinmei-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/dict">
      <span class="logo" aria-hidden="true">史</span>
      <span>
        <span class="brand-title">歴史人名辞典</span>
        <span class="brand-sub">西洋史・日本史（紀元後）</span>
      </span>
    </a>
    <div class="gsearch" id="gsearch" role="search">
      <span class="gs-icon" aria-hidden="true">🔍</span>
      <input type="search" id="gq" placeholder="全文検索（人名・出来事・本文・メモ）" autocomplete="off" aria-label="全文検索" enterkeyhint="search">
      <div class="gs-panel" id="gsPanel" hidden></div>
    </div>
    <div class="navwrap">
      <nav id="nav" aria-label="メインメニュー">
        <a href="#/dict" data-r="dict">辞典</a>
        <a href="#/timeline" data-r="timeline">年表</a>
        <a href="#/cards" data-r="cards">カード</a>
        <a href="#/quiz" data-r="quiz">クイズ</a>
        <a href="#/stats" data-r="stats">記録</a>
      </nav>
      <button class="theme-btn sync-chip" id="syncChip" hidden aria-label="端末間の同期">☁️</button>
      <button class="theme-btn" id="themeBtn" aria-label="明るい表示と暗い表示を切り替える" title="表示の明るさを切り替え">🌙</button>
    </div>
  </header>

  <main id="view"></main>

  <dialog id="detail" aria-label="人物の詳細"></dialog>

  <div class="gs-step" id="gsStep" hidden></div>
  <div class="tts-bar" id="ttsBar" hidden></div>

  <footer class="foot">
    学習記録はこのブラウザに保存されます。「記録」画面でGoogleアカウントにログインすると、ほかの端末と共有できます。
  </footer>

  <!-- ?v= は更新のたびに上げる版数（ブラウザに古いファイルを使わせないため） -->
  <script src="js/data.js?v=16"></script>
  <script src="js/people-modern.js?v=16"></script>
  <script src="js/details-west.js?v=16"></script>
  <script src="js/details-japan.js?v=16"></script>
  <script src="js/events.js?v=16"></script>
  <script src="js/events-china.js?v=16"></script>
  <script src="js/event-details.js?v=16"></script>
  <script src="js/event-more-west.js?v=16"></script>
  <script src="js/event-more-japan.js?v=16"></script>
  <script src="js/event-more-china.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/firebase-config.js?v=16"></script>
  <script type="module" src="js/sync.js?v=16"></script>
</body>
</html>
